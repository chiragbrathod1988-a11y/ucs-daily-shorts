<!doctype html>
<html><head><meta charset="utf-8"><style>
@font-face{font-family:P;src:url(../../public/fonts/poppins-latin-800-normal.woff2);font-weight:800}
@font-face{font-family:P;src:url(../../public/fonts/poppins-latin-700-normal.woff2);font-weight:700}
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#05070d}
.wrap{position:relative;width:1280px;height:720px;background:radial-gradient(circle at 30% 45%,#16233f 0%,#070b14 60%,#020306 100%)}
.photo{position:absolute;right:-10px;top:0;width:650px;height:720px;background:url(chirag_crop.jpg) center 18%/cover no-repeat;
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 26%);mask-image:linear-gradient(90deg,transparent 0%,#000 26%)}
.glow{position:absolute;right:120px;top:40px;width:460px;height:460px;border-radius:50%;background:radial-gradient(circle,rgba(245,196,81,.35),transparent 70%)}
.chip{position:absolute;left:46px;top:40px;background:#FFD400;color:#000;font:800 34px P;padding:8px 22px;border-radius:12px;transform:rotate(-2deg);box-shadow:0 6px 0 #000}
.t1,.t2{position:absolute;left:40px;font-family:P;font-weight:800;line-height:.95;-webkit-text-stroke:10px #000;paint-order:stroke fill;letter-spacing:-1px}
.t1{top:118px;font-size:128px;color:#FFD400;text-shadow:0 10px 0 #000}
.t2{top:262px;font-size:112px;color:#fff;text-shadow:0 9px 0 #000}
.sub{position:absolute;left:44px;top:420px;font:800 50px P;color:#fff;background:#E5262A;padding:6px 20px;border-radius:10px;box-shadow:0 6px 0 #000}
svg{position:absolute;left:30px;top:500px}
.gold{position:absolute;left:345px;top:628px;font:800 34px P;color:#000;background:linear-gradient(180deg,#FFF7D1,#F5C451 50%,#B8801A);padding:6px 16px;border-radius:10px;transform:rotate(3deg);box-shadow:0 5px 0 #000}
</style></head><body><div class="wrap">
<div class="glow"></div><div class="photo"></div>
<div class="chip">RSI STRATEGY</div>
<div class="t1">RSI = GOD</div>
<div class="t2">INDICATOR?</div>

<svg width="640" height="210" viewBox="0 0 640 210">
  <rect x="0" y="0" width="640" height="210" rx="16" fill="rgba(0,0,0,.55)" stroke="#F5C451" stroke-width="3"/>
  <line x1="20" x2="620" y1="60" y2="60" stroke="#E5262A" stroke-width="3" stroke-dasharray="10 8"/>
  <line x1="20" x2="620" y1="150" y2="150" stroke="#2BD46A" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="24" y="52" fill="#E5262A" font-family="P" font-weight="800" font-size="22">70</text>
  <text x="24" y="176" fill="#2BD46A" font-family="P" font-weight="800" font-size="22">30</text>
  <polyline fill="none" stroke="#fff" stroke-width="6" stroke-linejoin="round" points="60,70 110,95 150,80 200,130 240,150 280,185 320,175 360,120 410,90 460,55 500,40 540,70 600,95"/>
  <circle cx="280" cy="185" r="16" fill="none" stroke="#FFD400" stroke-width="5"/>
  <circle cx="500" cy="40" r="16" fill="none" stroke="#FFD400" stroke-width="5"/>
</svg>
<div class="gold">&lt;15 = GOLD MINE</div>
</div></body></html>
