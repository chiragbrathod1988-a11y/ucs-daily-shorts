name: UGC feature recordings (high-res dashboard pages)
on:
  push:
    branches: [main]
    paths: ["ugc/pages.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: ugc
jobs:
  rec:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji fonts-noto
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i -s playwright@1.48.2 && npx playwright install --with-deps chromium >/dev/null
      - name: Record
        env:
          UCS_DASH_TOKEN: ${{ secrets.UCS_DASH_TOKEN }}
        run: |
          cp scripts/ugc/rec.mjs /tmp/pw/ && rm -rf ugc/rec && node /tmp/pw/rec.mjs ugc/pages.json ugc/rec 2>&1 | tee ugc/rec-log.txt
      - name: Commit
        run: |
          git config user.name "ucs-ugc-bot"; git config user.email "actions@users.noreply.github.com"
          git add ugc/
          git diff --cached --quiet && exit 0
          git commit -m "UGC feature recordings"
          for i in 1 2 3; do git pull --rebase -q origin main && git push origin HEAD:main && break; sleep 5; done
